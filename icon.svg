<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad1)" stroke-width="8" opacity="0.3" />
  
  <!-- Main Gear -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Gear teeth -->
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(45)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(90)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(135)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(180)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(225)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(270)" />
    <path d="M-20,-110 L20,-110 L28,-80 L-28,-80 Z" fill="url(#grad1)" transform="rotate(315)" />
    
    <!-- Central Ring of Gear -->
    <circle cx="0" cy="0" r="85" fill="url(#grad1)" />
    <!-- Inner Core Cutout -->
    <circle cx="0" cy="0" r="55" fill="#0f172a" />
    
    <!-- Wrench/Technical symbol inside -->
    <path d="M-25,-25 L25,25" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" />
    <path d="M-25,25 L25,-25" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" />
    <circle cx="0" cy="0" r="22" fill="url(#grad1)" />
    <circle cx="0" cy="0" r="10" fill="#0f172a" />
  </g>
</svg>
